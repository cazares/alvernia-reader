# SignoVivo CI — the Release Safety System gate (M0).
#
# Runs on every pull request (the gate that blocks a bad merge) and on pushes to
# main (post-merge confirmation). It is the automated half of "no change reaches
# the choir until it's proven": typecheck + the SAFE e2e subset + the boot smoke
# test that would have caught the "busted for everyone" practice failure.
#
# RUNNER: macOS. web/build.mjs shells out to poppler (pdftoppm/pdftotext) and
# cwebp — the runner stays macOS so a faithful build (and thus the smoke test)
# matches the operator's own build machine.
#
# HARD RULE: never run `npm run test:e2e` here. That glob includes
# e2e/relay-sync.test.mjs, which publishes to the PRODUCTION relay room
# (alvernia-main) and would flip live followers' pages. CI runs ONLY the named
# safe files below. Also excluded: e2e/eas-config.test.mjs (shells out to
# `npx expo config`, hangs/brittle, and pins the banned EAS path — slated for
# deletion/conversion in P1-CI).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + safe tests + boot smoke
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install render tools (poppler + webp)
        run: brew install poppler webp

      # For e2e/spliceSongPages.test.mjs — behavioural tests of the tool that rewrites the songbook,
      # against real PDFs, rendered with poppler. Without these the tests skip LOUDLY (their choice), so
      # a failed install here degrades to a visible skip rather than a red run.
      - name: Install PDF tools (pikepdf + Pillow for the splice tests)
        run: pip3 install --break-system-packages pikepdf pillow || pip3 install pikepdf pillow || echo "::warning::pikepdf/Pillow did not install — spliceSongPages tests will skip"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ENUMERATED, NOT LISTED. This was a hand-maintained allowlist of 45 filenames, and a
      # hand-maintained list of tests is a list that silently stops covering things: an earlier
      # version of it skipped 24 files, including all four that were red at HEAD, and nothing
      # anywhere said so. A new test file added to e2e/ now runs here the moment it lands, instead
      # of the moment somebody remembers to add a line.
      #
      # The three exclusions are the only files that genuinely cannot run in CI, and each is
      # excluded for a stated reason rather than by omission:
      #   relay-sync  — publishes to the PRODUCTION relay room and would flip live followers' pages
      #   eas-config  — shells out to `npx expo config`, which hangs; it also pins the banned EAS path
      #   a2          — needs a live local `wrangler dev`
      - name: Safe e2e subset (everything except the three that cannot run here)
        run: |
          set -euo pipefail
          FILES=$(ls e2e/*.test.mjs sync-worker/test/*.test.mjs | grep -vE 'e2e/relay-sync\.test\.mjs|e2e/eas-config\.test\.mjs|sync-worker/test/a2\.test\.mjs')
          echo "running:"; echo "$FILES" | sed 's/^/  /'
          node --test $FILES

      - name: Boot smoke test (builds the bundle, asserts it can render + boot)
        run: node scripts/smoke-boot.mjs

      # The additive-only gate: refuse a build that revised or removed a page devices already
      # have. Runs here AND in scripts/release.sh — CI catches it on the PR, release.sh catches
      # it on the path the artifact actually leaves the building on. Build 377 / PR #257 shipped
      # ~290 in-place page re-renders precisely because the gate existed only on one of those.
      # The baseline is read with `git show HEAD:` so a same-commit edit cannot self-approve.
      - name: Additive-only gate (published pages are immutable)
        run: node scripts/additive-gate.mjs --allow-renderer-drift

      # Runs AFTER the smoke test so web/dist already exists — this one never builds.
      # Proves the smoke test's WIRING guards can actually fail: a call-site assertion that
      # merely quotes the current source passes forever and catches nothing, and a passing
      # test looks identical either way. Mutates a copy of the bundle and requires each
      # guard to trip.
      - name: Guard mutation test (proves the wiring guards have teeth)
        run: node scripts/verify-smoke-guards.mjs

      # Same reasoning, applied to the page-slot poisoning guards in sw.js + app.js. Reverts
      # each one against a copy of web/src and requires the matching e2e test to go RED. Reads
      # only web/src, so it does not depend on the build above.
      - name: Page-cache guard mutation test (proves the poisoning guards have teeth)
        run: node scripts/verify-sw-page-cache-guards.mjs

      # Same reasoning again, for the director + rescue guards. These tests assert on SOURCE TEXT
      # because the logic lives inside a React effect that cannot be imported without a React Native
      # runtime — the single easiest way to write a test that passes forever and proves nothing.
      # Measured the first time this ran: 13 of 13 mutations slipped past, including "the director
      # button appears on the public web" and "the panic switches fire before their confirmation".
      # It also fails if the unmutated suite is red, because that alone makes every mutation "pass".
      - name: Director/rescue guard mutation test (proves those guards have teeth)
        run: node scripts/verify-director-rescue-guards.mjs

      # The newest member of the verify-*-guards family, and the broadest. On 2026-08-29 nineteen
      # assertions in e2e/ were PROVEN decorative by measurement — apply a real regression, re-run
      # the named test, watch it stay green. Among them: the publish rate limit (the only abuse
      # control on an open endpoint) deleted; the four-way director predicate flipped from || to &&,
      # which makes a follower hang up on its own director; parseInboundPayload force-unwrapping so
      # any peer in range can crash the app; the songbook index truncated to 10 of 317 entries.
      #
      # This replays all nineteen and requires each to redden THE NAMED TEST, scoped with
      # --test-name-pattern so a sibling assertion in the same file cannot take the credit.
      - name: Behavioural guard mutation test (replays the 19 regressions that used to slip through)
        run: node scripts/verify-behavioural-guards.mjs

      # The stale-handoff guard. A HANDOFF.md lived at the repo root and rotted three times — by
      # 5 weeks and 41 builds (#284), with three claims outright wrong (3f9b842), and finally from
      # 2026-08-18 to 2026-09-01 telling every cold tab "read it before touching anything" while
      # describing a superseded build and a branch that was never merged. Two audits filed it OPEN
      # and it went on misleading sessions anyway, because a finding in a doc cannot enforce itself.
      # This breaks each thing the guard protects and requires the suite to go red.
      - name: Stale-handoff guard mutation test (a committed handoff misleads the next session)
        run: node scripts/verify-handoff-guards.mjs
