# SignoVivo CI — the Release Safety System gate (M0).
#
# Runs on every pull request (the gate that blocks a bad merge) and on pushes to
# main (post-merge confirmation). It is the automated half of "no change reaches
# the choir until it's proven": typecheck + the SAFE e2e subset + the boot smoke
# test that would have caught the "busted for everyone" practice failure.
#
# RUNNER: macOS. web/build.mjs shells out to poppler (pdftoppm/pdftotext) and
# cwebp — the runner stays macOS so a faithful build (and thus the smoke test)
# matches the operator's own build machine.
#
# HARD RULE: never run `npm run test:e2e` here. That glob includes
# e2e/relay-sync.test.mjs, which publishes to the PRODUCTION relay room
# (alvernia-main) and would flip live followers' pages. CI runs ONLY the named
# safe files below. Also excluded: e2e/eas-config.test.mjs (shells out to
# `npx expo config`, hangs/brittle, and pins the banned EAS path — slated for
# deletion/conversion in P1-CI).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + safe tests + boot smoke
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install render tools (poppler + webp)
        run: brew install poppler webp

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Safe e2e subset (named files only — NEVER the full e2e glob)
        run: >
          node --test
          e2e/repo-minimal-footprint.test.mjs
          e2e/native-entrypoint.test.mjs
          e2e/native-stability-config.test.mjs
          e2e/offline-books-integrity.test.mjs
          e2e/nearby-sync-contract.test.mjs
          e2e/permission-flow.test.mjs
          e2e/svRelayRoom.test.mjs
          e2e/svSelftest.test.mjs
          e2e/svSyncDecision.test.mjs
          e2e/additiveGate.test.mjs
          e2e/bookResolve.test.mjs

      - name: Boot smoke test (builds the bundle, asserts it can render + boot)
        run: node scripts/smoke-boot.mjs

      # The additive-only gate: refuse a build that revised or removed a page devices already
      # have. Runs here AND in scripts/release.sh — CI catches it on the PR, release.sh catches
      # it on the path the artifact actually leaves the building on. Build 377 / PR #257 shipped
      # ~290 in-place page re-renders precisely because the gate existed only on one of those.
      # The baseline is read with `git show HEAD:` so a same-commit edit cannot self-approve.
      - name: Additive-only gate (published pages are immutable)
        run: node scripts/additive-gate.mjs

      # Runs AFTER the smoke test so web/dist already exists — this one never builds.
      # Proves the smoke test's WIRING guards can actually fail: a call-site assertion that
      # merely quotes the current source passes forever and catches nothing, and a passing
      # test looks identical either way. Mutates a copy of the bundle and requires each
      # guard to trip.
      - name: Guard mutation test (proves the wiring guards have teeth)
        run: node scripts/verify-smoke-guards.mjs
