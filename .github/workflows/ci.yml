# SignoVivo CI — the Release Safety System gate (M0).
#
# Runs on every pull request (the gate that blocks a bad merge) and on pushes to
# main (post-merge confirmation). It is the automated half of "no change reaches
# the choir until it's proven": typecheck + the SAFE e2e subset + the boot smoke
# test that would have caught the "busted for everyone" practice failure.
#
# RUNNER: macOS. web/build.mjs shells out to `sips` (macOS-only) plus poppler
# (pdftoppm/pdftotext) and cwebp — so a faithful build (and thus the smoke test)
# only runs on macOS, matching the operator's own build machine.
#
# HARD RULE: never run `npm run test:e2e` here. That glob includes
# e2e/relay-sync.test.mjs, which publishes to the PRODUCTION relay room
# (alvernia-main) and would flip live followers' pages. CI runs ONLY the named
# safe files below. Also excluded: e2e/eas-config.test.mjs (shells out to
# `npx expo config`, hangs/brittle, and pins the banned EAS path — slated for
# deletion/conversion in P1-CI).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + safe tests + boot smoke
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install render tools (poppler + webp; sips is built into macOS)
        run: brew install poppler webp

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Safe e2e subset (named files only — NEVER the full e2e glob)
        run: >
          node --test
          e2e/repo-minimal-footprint.test.mjs
          e2e/native-entrypoint.test.mjs
          e2e/native-stability-config.test.mjs
          e2e/offline-books-integrity.test.mjs
          e2e/nearby-sync-contract.test.mjs
          e2e/permission-flow.test.mjs

      - name: Boot smoke test (builds the bundle, asserts it can render + boot)
        run: node scripts/smoke-boot.mjs
